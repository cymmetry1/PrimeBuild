name: MT5 demo broker smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  demo-connection:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      MT5_LOGIN: ${{ secrets.MT5_DEMO_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_DEMO_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_DEMO_SERVER }}
      API_KEY: ${{ secrets.MT5_GATEWAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Require demo credentials
        run: |
          test -n "$MT5_LOGIN" && test -n "$MT5_PASSWORD" && test -n "$MT5_SERVER" && test -n "$API_KEY"
      - name: Start open-source MT5 gateway
        run: |
          docker volume create mt5-gateway-config
          docker run -d --name mt5-demo --rm -p 127.0.0.1:5001:5001 -v mt5-gateway-config:/config             -e MT5_LOGIN -e MT5_PASSWORD -e MT5_SERVER -e API_KEY             -e MT5_ENABLE_ALGO_TRADING=0             elitekaycy/mt5-gateway-api:latest
      - name: Verify real broker demo connection without trading
        run: python3 tools/verify_demo_gateway.py
      - name: Diagnose gateway failure (redacted)
        if: failure()
        run: |
          docker inspect mt5-demo --format 'State={{.State.Status}} ExitCode={{.State.ExitCode}}' || true
          docker exec mt5-demo sh -c 'ps aux | grep -E "wine|python|mt5|gunicorn|terminal" | grep -v grep | cut -c 1-150' || true
          docker exec mt5-demo sh -c 'ls -la /tmp/mt5* /config/ 2>/dev/null | head -35' || true
          docker logs --tail 200 mt5-demo 2>&1 | sed -E 's/[0-9]{7,}/[REDACTED]/g' | grep -Ei 'traceback|exception|fatal|error|failed|import|module|server|bind|listening|starting|ready|resolver|terminal|login|ipc|timeout' | tail -35 || true
          docker port mt5-demo || true
          curl --max-time 5 -s -o /dev/null -w 'HTTP status: %{http_code}\\n' http://127.0.0.1:5001/health/ready || true
      - name: Stop gateway
        if: always()
        run: docker rm -f mt5-demo || true
